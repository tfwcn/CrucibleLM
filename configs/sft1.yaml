# SFT 一阶段：base 权重起步，sft-zh 单数据源，KD 锚点（已跑完，956 步，eval 2.65）
# 用法：python scripts/run_train.py configs/sft1.yaml
description: sft stage1 from base

phase: sft
preset: base
seq_len: 2048
batch: 4
accum: 8
sft_init: data/llm-ckpt/model.pt
max_steps: 2000
lr: 1.0e-4
warmup: 20
grad_ckpt: true
ckpt_dir: data/llm-sft
vocab: data/llm-ckpt/vocab.json
data: local
local_path: data/sft-zh
extend_vocab: true
eval_every: 100
sample_every: 100
kd_teacher: data/teacher-0.5b
kd_alpha: 0.5
