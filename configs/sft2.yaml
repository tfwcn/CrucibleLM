# SFT 二阶段：sft1 终点续训，KD 降频（已跑完 420 步后手动停，最低 val 2.476@200）
# 用法：python scripts/run_train.py configs/sft2.yaml
description: sft stage2 with kd-every

phase: sft
preset: base
seq_len: 2048
batch: 4
accum: 8
sft_init: data/llm-sft/model.pt
max_steps: 2000
lr: 1.0e-4
warmup: 20
grad_ckpt: true
ckpt_dir: data/llm-sft2
vocab: data/llm-sft/vocab.json
data: local
local_path: data/sft-zh
extend_vocab: true
eval_every: 100
sample_every: 100
kd_teacher: data/teacher-0.5b
kd_alpha: 0.5
kd_every: 8
