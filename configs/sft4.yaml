# sft4：记忆层 + RETRO V2 同开（both-init 起点；冠军 ckpt-000200，val 2.425）
# 用法：python scripts/run_train.py configs/sft4.yaml
description: memory+retroV2, champion ckpt-200 val 2.425

phase: sft
preset: base
seq_len: 2048
batch: 4
accum: 8
sft_init: data/llm-sft-both-init/model.pt
max_steps: 1000
lr: 5.0e-5
warmup: 20
grad_ckpt: true
ckpt_dir: data/llm-sft4
vocab: data/llm-sft/vocab.json
data: local
local_path: data/sft-zh
extend_vocab: true
eval_every: 100
sample_every: 100
kd_teacher: data/teacher-0.5b
kd_alpha: 0.5
kd_every: 8
enable_memory: true
enable_retro: true
retro_db: data/retro-sft.pkl
retro_k: 2
retro_every: 4
retro_len: 64
