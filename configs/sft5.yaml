# sft5：记忆层 + RETRO V2 同开，RHO-teacher + EMA + pretrain 回放，半 LR 续训
# 起点：sft4/ckpt-000200（冠军，val 2.425，含记忆+retro 键）
# 用法：python scripts/run_train.py configs/sft5.yaml
description: sft5 memory+retroV2, rho-teacher, ema, replay, lr halved

phase: sft
preset: base
seq_len: 2048
batch: 4
accum: 8
sft_init: data/llm-sft4/ckpt-000200/model.pt
max_steps: 1000
lr: 2.5e-5
warmup: 20
grad_ckpt: true
ckpt_dir: data/llm-sft5
vocab: data/llm-sft/vocab.json
data: local
local_path: "data/sft-zh:3,data/sft-belle:1"
extend_vocab: true
eval_every: 50
sample_every: 100
kd_teacher: data/teacher-0.5b
kd_alpha: 0.5
kd_every: 8
rho_keep: 0.5
rho_ref: teacher
ema_every: 10
sft_replay_dir: data/hq-zh
sft_replay_ratio: 0.15
enable_memory: true
enable_retro: true
retro_db: data/retro-sft.pkl
retro_k: 2
retro_every: 4
retro_len: 64
