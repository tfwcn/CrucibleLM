[project]
name = "cruciblelm"
version = "0.1.0"
description = "CrucibleLM: an experimental testbed fusing state-of-the-art LLM architectures (MLA, hybrid linear attention, MoE) into a small model trainable on a single 16GB GPU"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
hf = ["datasets>=2.0"]
teach = ["transformers>=4.53,<5", "accelerate"]
ms = ["modelscope"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 500
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
